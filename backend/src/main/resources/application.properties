spring.application.name=don5

# MongoDb
spring.mongodb.uri=mongodb://admin:supersecret@localhost:27017/don5?authSource=admin

#Neo4J
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=supersecret

# Elasticsearch
spring.elasticsearch.uris=http://localhost:9200
# Optional: tune timeouts to be resilient during container startup
spring.elasticsearch.connection-timeout=5s
spring.elasticsearch.socket-timeout=30s

