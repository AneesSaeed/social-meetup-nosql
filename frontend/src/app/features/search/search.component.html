<div class="search">
  <div class="search__input">
    <!-- Text input bound to FormControl -->
    <input
      type="text"
      [formControl]="query"
      [placeholder]="placeholder()"
      autocomplete="off"
      (focus)="open = isReadyToSearch(query.value.trim())"
    />

    <!-- Mode toggle inside the input container -->
    <div class="search__toggle" role="tablist" aria-label="Search mode">
      <button
        type="button"
        class="toggle-btn"
        [class.toggle-btn--active]="mode === 'users'"
        (click)="setMode('users')"
      >
        Users
      </button>
      <button
        type="button"
        class="toggle-btn"
        [class.toggle-btn--active]="mode === 'interests'"
        (click)="setMode('interests')"
      >
        Interests
      </button>
    </div>

    <!-- Clear input (only shown when not empty) -->
    <button type="button" class="search__clear" *ngIf="query.value" (click)="clear()">×</button>
  </div>

  <!-- Results dropdown -->
  <div class="search__panel" *ngIf="open">
    <div class="search__status" *ngIf="loading">Loading…</div>
    <div class="search__status error" *ngIf="!loading && error">{{ error }}</div>

    <!-- Empty state -->
    <div class="search__empty" *ngIf="!loading && !error && results.length === 0">
      <div class="search__empty-title">No results</div>
      <div class="search__empty-sub">
        Try a different keyword<span *ngIf="mode === 'interests'">, or separate interests with commas</span>.
      </div>
    </div>


    <!-- Results list -->
    <div class="search__list" *ngIf="!loading && !error && results.length > 0">
      <button
        class="search__item"
        type="button"
        *ngFor="let u of results; trackBy: trackByUserId"
        (click)="openUser(u)"
      >
        <div class="name">{{ u.name }}</div>
        <!-- Interests (CSS keeps one line and clips overflow) -->
        <div class="badges one-line" *ngIf="u.interests?.length">
          <span
            class="badge"
            *ngFor="let i of u.interests"
            [ngClass]="'badge--c' + (i | colorBucket)"
          >
            {{ i }}
          </span>
        </div>
      </button>
    </div>
  </div>
</div>


<app-base-modal
  *ngIf="isOpen"
  [title]="modalTitle"
  [component]="modalComponent"
  [data]="modalData"
  (closed)="onModalClosed()"
>
</app-base-modal>
