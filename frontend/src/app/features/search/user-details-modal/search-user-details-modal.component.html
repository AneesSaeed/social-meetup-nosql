<div class="user-details">
  <p class="status" *ngIf="loading">Loading…</p>
  <p class="status error" *ngIf="!loading && errorMsg">{{ errorMsg }}</p>
  <p class="status" *ngIf="!loading && !errorMsg && !user">No user loaded</p>

  <ng-container *ngIf="!loading && !errorMsg && user as u">
    <div class="head">
      <div class="name">{{ u.name }}</div>
      <div class="email">{{ u.email }}</div>
    </div>

    <div class="section" *ngIf="u.bio">
      <div class="label">Bio</div>
      <div class="value">{{ u.bio }}</div>
    </div>

    <div class="section" *ngIf="u.interests?.length">
      <div class="label">Interests</div>
      <div class="badges">
        <span class="badge badge--c{{ it | colorBucket }}" *ngFor="let it of u.interests">
          {{ it }}
        </span>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="k">Total points</div>
        <div class="v">{{ u.totalPoints }}</div>
      </div>
      <div class="stat">
        <div class="k">Total meetings</div>
        <div class="v">{{ u.totalMeetings }}</div>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn-meet">Meet</button>
    </div>
  </ng-container>
</div>
