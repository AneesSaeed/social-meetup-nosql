<div class="auth-container">
  <div class="auth-card">
    <h2>Create Your Profile</h2>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label for="name">Name</label>
      <input id="name" type="text" formControlName="name" placeholder="Enter your full name" autocomplete="name" />

      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" placeholder="Enter your email" autocomplete="email" />

      <label for="bio">Bio</label>
      <textarea id="bio" formControlName="bio" placeholder="Tell us something about yourself"></textarea>

      <label>Add Interest</label>
      <div class="interest-input">
        <input
          #interestField
          type="text"
          placeholder="e.g. football, cooking, coding"
          (keydown.enter)="addInterest(interestField.value); interestField.value = ''; $event.preventDefault();" />
        <button type="button" (click)="addInterest(interestField.value); interestField.value = '';">
          Add
        </button>
      </div>

      <div class="interests-list">
        <span *ngFor="let interest of interestsArray.controls; let i = index" class="badge">
          {{ interest.value }}
          <button type="button" (click)="removeInterest(i)" aria-label="Remove interest">×</button>
        </span>
      </div>

      <p class="error-msg" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button class="submit-btn" type="submit" [disabled]="form.invalid || interestsArray.length === 0">
        Register
      </button>
    </form>

    <a routerLink="/login">Already have an account?</a>
  </div>
</div>
