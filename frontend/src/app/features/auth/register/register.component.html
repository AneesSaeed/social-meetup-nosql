<div class="auth-container">
  <div class="auth-card">
    <h2>Create Your Profile</h2>

    <form [formGroup]="form" (ngSubmit)="submit()">

        <!-- NAME -->
        <label>Name</label>
        <input type="text" formControlName="name" />

        <!-- EMAIL -->
        <label>Email</label>
        <input type="email" formControlName="email" />

        <!-- BIO -->
        <label>Bio</label>
        <textarea formControlName="bio"></textarea>

        <!-- INTERESTS -->
        <label>Add Interest</label>
        <div class="interest-input">
          <!-- #interestField gives a direct reference to this input element -->
          <input #interestField type="text" placeholder="e.g. football" />
          <!-- After adding, we clear the input by setting interestField.value = '' -->
          <button type="button" (click)="addInterest(interestField.value); interestField.value = '';">
            Add
          </button>
        </div>

        <div class="interests-list">
          <!-- interestsArray.controls is the list of FormControls inside the FormArray -->
          <span *ngFor="let interest of interestsArray.controls; let i = index" class="badge">
            {{ interest.value }}
            <button type="button" (click)="removeInterest(i)">X</button>
          </span>
        </div>

        <!-- Disabled until form valid; Angular manages this automatically -->
        <button class="submit-btn" type="submit" [disabled]="form.invalid">
          Register
        </button>
      </form>

    <a routerLink="/login">Already have an account?</a>
  </div>
</div>
