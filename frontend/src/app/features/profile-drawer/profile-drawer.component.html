<div class="drawer-overlay" *ngIf="open" (click)="close.emit()" aria-hidden="true"></div>

<aside
  class="drawer"
  [class.drawer--open]="open"
  (click)="$event.stopPropagation()"
  role="dialog"
  aria-modal="true"
  aria-label="Profile drawer"
>
  <header class="drawer__header">
    <div class="drawer__title">Profile</div>
    <button type="button" class="drawer__icon-btn" (click)="close.emit()" aria-label="Close">✕</button>
  </header>

  <ng-container *ngIf="user$ | async as user">
    <div class="drawer__content">
      <!-- total points -->
      <div class="drawer__points">
        <span class="drawer__label">Total Points</span>
        <span class="drawer__value">{{ user.totalPoints }}</span>
      </div>
      <!-- number of meetings -->
      <div class="drawer__points">
        <span class="drawer__label">Total Meetings</span>
        <span class="drawer__value">{{ user.totalMeetings }}</span>
      </div>

      <!-- BIO -->
      <section class="drawer__section">
        <div class="drawer__section-head">
          <span class="drawer__label">Bio</span>

          <button type="button"
                  class="drawer__icon-btn"
                  (click)="toggleBioEdit(user)"
                  aria-label="Edit bio">
            ✎
          </button>
        </div>

        <!-- readonly -->
        <p class="drawer__text" *ngIf="!editingBio">
          {{ user.bio || '—' }}
        </p>

        <!-- edit mode -->
        <div *ngIf="editingBio" class="drawer__edit">
          <textarea class="drawer__textarea" [formControl]="bioCtrl" rows="4"></textarea>

          <div class="drawer__edit-actions">
            <button type="button" class="btn btn-ghost" (click)="toggleBioEdit(user)">Cancel</button>
            <button type="button" class="btn btn-primary" [disabled]="savingBio" (click)="saveBio()">
              {{ savingBio ? 'Saving...' : 'Save' }}
            </button>
          </div>
        </div>
      </section>

      <!-- INTERESTS -->
      <section class="drawer__section">
        <div class="drawer__section-head">
          <span class="drawer__label">Interests</span>

          <button type="button"
                  class="drawer__icon-btn"
                  (click)="toggleInterestsEdit()"
                  aria-label="Edit interests">
            ✎
          </button>
        </div>

        <!-- readonly -->
        <div class="badges" *ngIf="!editingInterests">
          <span
            class="badge"
            *ngFor="let interest of (user.interests ?? [])"
            [ngClass]="'badge--c' + (interest | colorBucket:10)"
            [title]="interest">
            {{ interest }}
          </span>
          <p class="drawer__text" *ngIf="!(user.interests?.length)">—</p>
        </div>

        <!-- edit mode -->
        <div *ngIf="editingInterests" class="drawer__edit">
          <div class="drawer__interest-add">
            <input class="drawer__input" type="text" [formControl]="interestCtrl" placeholder="Add an interest..." />
            <button type="button" class="btn btn-primary" (click)="addInterest(user)" [disabled]="savingInterests">
              Add
            </button>
          </div>

          <div class="badges" *ngIf="user.interests?.length">
            <span
              class="badge"
              *ngFor="let interest of user.interests"
              [ngClass]="'badge--c' + (interest | colorBucket:10)">
              {{ interest }}
              <button type="button" class="badge__remove" (click)="removeInterest(user, interest)" aria-label="Remove">×</button>
            </span>
          </div>

          <div class="drawer__edit-actions">
            <button type="button" class="btn btn-ghost" (click)="toggleInterestsEdit()">Done</button>
          </div>
        </div>
      </section>
    </div>

    <footer class="drawer__footer">
      <button type="button" class="drawer__logout" (click)="logout.emit()">Logout</button>
    </footer>
  </ng-container>
</aside>
