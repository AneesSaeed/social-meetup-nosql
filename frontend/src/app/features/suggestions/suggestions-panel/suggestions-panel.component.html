<div *ngIf="!loading && !error && items.length === 0" class="state">
  No suggestions yet. Complete meetings to grow your network.
</div>

<div *ngIf="!loading && !error && items.length > 0" class="list">
  <div
    class="card card--clickable"
    *ngFor="let u of items; trackBy: trackByUserId"
    role="button"
    tabindex="0"
    (click)="openUser(u.userId)"
    (keydown.enter)="openUser(u.userId)"
    (keydown.space)="openUser(u.userId); $event.preventDefault()"
  >
    <div class="card__main">
      <div class="name">{{ u.userName }}</div>
      <div class="meta">{{ u.mutualFriends }} mutual connection(s)</div>
    </div>

    <div class="card__actions">
      <span class="pill">Suggested</span>
    </div>
  </div>
</div>

<!-- user details modal (reuses same component as search) -->
<app-base-modal
  *ngIf="isOpen"
  [title]="modalTitle"
  [component]="modalComponent"
  [data]="modalData"
  (closed)="onModalClosed()">
</app-base-modal>
