<section class="panel">
  <div class="panel-header">
    <h2>Suggestions</h2>
  </div>

  <div class="panel-body">
    <div *ngIf="loading" class="state">Loading suggestions…</div>

    <div *ngIf="!loading && error" class="state state--error">
      {{ error }}
    </div>

    <div *ngIf="!loading && !error && items.length === 0" class="state">
      No suggestions yet. Complete meetings to grow your network.
    </div>

    <div class="grid" *ngIf="!loading && !error && items.length > 0">
      <button
        class="card suggestion-card"
        type="button"
        *ngFor="let u of items; trackBy: trackByUserId"
        (click)="openUser(u.userId)"
      >
        <div class="card-header">
          <div class="title">{{ u.userName }}</div>
          <span class="pill">Suggested</span>
        </div>

        <div class="mutual">
          <span class="mutual__num">{{ u.mutualFriends }}</span>
          <span class="mutual__label">mutual connection(s)</span>
        </div>

        <div class="hint">
          Click to view profile and propose a 1:1 meeting.
        </div>
      </button>
    </div>
  </div>
</section>

<app-base-modal
  *ngIf="isOpen"
  [title]="modalTitle"
  [component]="modalComponent"
  [data]="modalData"
  (closed)="onModalClosed()">
</app-base-modal>
