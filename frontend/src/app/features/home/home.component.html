<div class="home">
  <div class="fab">
    <app-create-meeting-button (clicked)="openCreate()"></app-create-meeting-button>
  </div>

  <main class="content">
    <section class="panel">
      <div class="panel-header">
        <h2>Suggestions</h2>
      </div>
      <div class="panel-body placeholder">
        Suggested meetings will appear here.
      </div>
    </section>

    <section class="panel">
      <div class="panel-body">
        <app-upcoming-meetings-row></app-upcoming-meetings-row>
      </div>
    </section>
  </main>
</div>

<app-base-modal
  *ngIf="isCreateOpen && session.currentUser"
  [title]="modalTitle"
  [component]="modalComponent"
  [data]="{ userId: session.currentUser.id }"
  (closed)="onCreateClosed()">
</app-base-modal>
