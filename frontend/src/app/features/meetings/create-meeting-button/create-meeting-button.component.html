<button class="fab" type="button" (click)="open()" [disabled]="!session.isLoggedIn()">
  <span class="fab__icon" aria-hidden="true">＋</span>
  <span class="fab__text">Create meeting</span>
</button>

<app-base-modal
  *ngIf="isOpen && session.currentUser"
  title="Create meeting"
  [component]="formComponent"
  [data]="{ userId: session.currentUser.id }"
  (closed)="onClosed($event)">
</app-base-modal>
