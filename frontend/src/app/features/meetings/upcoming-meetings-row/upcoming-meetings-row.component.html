<section class="section">
  <div class="section-header">
    <h2>Upcoming meetings</h2>
  </div>

  <p *ngIf="loading">Loading...</p>
  <p *ngIf="errorMsg">{{ errorMsg }}</p>

  <div class="grid" *ngIf="!loading && meetings.length > 0">
    <button
      class="card"
      type="button"
      *ngFor="let m of meetings"
      (click)="openDetails(m)">
      <div class="title">{{ m.title }}</div>
      <div class="meta">
        <span>{{ m.date | date:'medium' }}</span>
        <span>•</span>
        <span>{{ m.location }}</span>
      </div>
      <div class="tag">{{ m.interests }}</div>
      <div class="foot">
        <span>{{ m.participants.length }}/{{ m.maxParticipants }}</span>
        <span>{{ m.eventType }}</span>
      </div>
    </button>
  </div>
  <p *ngIf="!loading && meetings.length === 0">No upcoming meetings yet.</p>
</section>

<app-base-modal
  *ngIf="isOpen"
  [title]="modalTitle"
  [component]="modalComponent"
  [data]="modalData"
  (closed)="onModalClosed()">
</app-base-modal>
