<section class="section">
  <div class="section-header">
    <div>
      <h2>Upcoming meetings</h2>
    </div>
    <div class="searchBar">
      <input
        class="interest-search"
        type="text"
        [formControl]="interestQuery"
        placeholder="Search by interest or location…" />
      </div>
    </div>

    @if (loading) {
      <p>Loading...</p>
    }
    @if (errorMsg) {
      <p>{{ errorMsg }}</p>
    }

    @if (!loading && meetings.length > 0) {
      <div class="grid">
        @for (m of meetings; track m) {
          <button
            class="card"
            type="button"
            (click)="openDetails(m)"
            >
            <div class="card-header">
              <div class="title">{{ m.title }}</div>
              @if (session.isLoggedIn()) {
                <div class="status">
                  @if (isJoined(m)) {
                    <span class="badge badge--joined">Joined</span>
                  }
                  @if (isFull(m)) {
                    <span class="badge badge--full">Full</span>
                  }
                </div>
              }
            </div>
            <div class="meta">
              <span>{{ m.date | date:'medium' }}</span>
              <span>•</span>
              <span>{{ m.location }}</span>
            </div>
            @if (m.interests?.length) {
              <div class="badges">
                @for (it of m.interests; track it) {
                  <span class="badge badge--c{{ it | colorBucket }}">{{ it }}</span>
                }
              </div>
            }
            <div class="card-foot">
              <span>{{ m.participants.length }}/{{ m.maxParticipants }}</span>
              <span>{{ m.eventType }}</span>
            </div>
          </button>
        }
      </div>
    }
    @if (!loading && meetings.length === 0) {
      <p>No upcoming meetings yet.</p>
    }
  </section>

  @if (isOpen) {
    <app-base-modal
      [title]="modalTitle"
      [component]="modalComponent"
      [data]="modalData"
      (closed)="onModalClosed()">
    </app-base-modal>
  }
