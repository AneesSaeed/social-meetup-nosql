<section class="section">
  <div class="section-header">
    <div>
      <h2>Past meetings</h2>
    </div>
  </div>

  <p *ngIf="loading">Loading...</p>
  <p *ngIf="!loading && errorMsg">{{ errorMsg }}</p>

  <div class="grid" *ngIf="!loading && meetings.length > 0">
    <button
      class="card"
      type="button"
      *ngFor="let m of meetings; trackBy: trackById"
      (click)="openDetails(m)"
    >
      <div class="card-header">
        <div class="title">{{ m.title }}</div>
        <div class="status">
          <span class="badge badge--done">Completed</span>
        </div>
      </div>

      <div class="meta">
        <span>{{ m.date | date:'medium' }}</span>
        <span>•</span>
        <span>{{ m.location }}</span>
      </div>

      <div class="badges" *ngIf="m.interests?.length">
        <span class="badge badge--c{{ it | colorBucket }}" *ngFor="let it of m.interests">{{ it }}</span>
      </div>

      <div class="card-foot">
        <span>{{ m.participants.length }}/{{ m.maxParticipants }}</span>
        <span>Points: {{ m.points }}</span>
      </div>
    </button>
  </div>

  <p *ngIf="!loading && meetings.length === 0">No past meetings yet.</p>
</section>

<app-base-modal
  *ngIf="isOpen"
  [title]="modalTitle"
  [component]="modalComponent"
  [data]="modalData"
  (closed)="onModalClosed()">
</app-base-modal>
