<div class="wrap">
  <div class="top">
    <div class="line">
      <span class="label">When</span>
      <span class="value">{{ meeting.date | date:'full' }}</span>
    </div>

    <div class="line">
      <span class="label">Where</span>
      <span class="value">{{ meeting.location }}</span>
    </div>

    <div class="line">
      <span class="label">Type</span>
      <span class="value">{{ meeting.eventType }}</span>
    </div>

    <div class="line interests-line">
      <span class="label">Interests</span>
        <div class="badges" *ngIf="meeting.interests?.length">
          <span class="badge badge--c{{ it | colorBucket }}" *ngFor="let it of meeting.interests">{{ it }}</span>
        </div>
      <ng-template #noInterests>
        <span class="value">—</span>
      </ng-template>
    </div>


    <div class="line">
      <span class="label">Participants</span>
      <span class="value">{{ meeting.participants.length }}/{{ meeting.maxParticipants }}</span>
    </div>
  </div>

  <p class="desc" *ngIf="meeting.description">{{ meeting.description }}</p>

  <div class="actions">
    <button class="btn btn-ghost" type="button" (click)="close()">Close</button>

    <button
      class="btn btn-soft"
      type="button"
      *ngIf="session.isLoggedIn() && !isParticipant"
      [disabled]="busy || isFull"
      (click)="join()">
      {{ isFull ? 'Full' : (busy ? 'Joining...' : 'Join') }}
    </button>

    <button
      class="btn btn-soft"
      type="button"
      *ngIf="session.isLoggedIn() && isParticipant"
      [disabled]="busy"
      (click)="leave()">
      {{ busy ? 'Leaving...' : 'Leave' }}
    </button>
  </div>
</div>
